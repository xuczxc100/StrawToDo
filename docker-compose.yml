# Host Docker address pools are exhausted — do not declare new networks.
# API uses host network so it can reach cursor-openai-bridge on 127.0.0.1:8643.
name: strawtodo

services:
  db:
    image: postgres:16-alpine
    container_name: strawtodo-db
    network_mode: bridge
    environment:
      POSTGRES_USER: strawtodo
      POSTGRES_PASSWORD: strawtodo
      POSTGRES_DB: strawtodo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - strawtodo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strawtodo -d strawtodo"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: strawtodo-api:latest
    container_name: strawtodo-api
    network_mode: host
    environment:
      PORT: "3040"
      DATABASE_URL: postgres://strawtodo:strawtodo@127.0.0.1:5433/strawtodo
      BOOTSTRAP_API_KEY: ${BOOTSTRAP_API_KEY:-std_dev_bootstrap_key_change_me}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me-webhook-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      EXPOSE_UI_KEY: ${EXPOSE_UI_KEY:-0}
      LOGIN_USER: ${LOGIN_USER:-cz}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      AGENT_MODE: ${AGENT_MODE:-bridge}
      AGENT_MODEL: ${AGENT_MODEL:-auto}
      BRIDGE_URL: ${BRIDGE_URL:-http://127.0.0.1:8643}
      BRIDGE_API_KEY: ${BRIDGE_API_KEY:-}
      BRIDGE_JOBS_DIR: /var/lib/cursor-openai-bridge/jobs
    volumes:
      - /var/lib/cursor-openai-bridge/jobs:/var/lib/cursor-openai-bridge/jobs:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: strawtodo-web:latest
    container_name: strawtodo-web
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3041:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  strawtodo_pg:
