server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /v1/ {
    proxy_pass http://api:3040/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /docs {
    proxy_pass http://api:3040/docs;
  }

  location /openapi.json {
    proxy_pass http://api:3040/openapi.json;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
