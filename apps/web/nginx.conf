server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /v1/ {
    proxy_pass http://host.docker.internal:3040/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location /docs {
    proxy_pass http://host.docker.internal:3040/docs;
  }

  location /openapi.json {
    proxy_pass http://host.docker.internal:3040/openapi.json;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
